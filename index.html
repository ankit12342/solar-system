<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./solar_system.css">
</head>
<body>

    

    <div class="container">
        <h1>Solar System</h1>
        <div class="stars"></div>
        <div class="stars2"></div>
        <div class="stars3"></div>

        <div class="solar-system">
            <div class="sun">
                <div class="sun-label">Sun</div>
            </div>
            <div class="mercury-outline">
                <div class="mercury">
                    <div class="mercury-label">Mercury</div>
                </div>
            </div>
            <div class="venus-outline">
                <div class="venus">
                    <div class="venus-label">Venus</div>
                </div>
            </div>

            <div class="earth-outline">
                <div class="earth">
                    <div class="earth-label">Earth</div>
                </div>
            </div>
            <div class="mars-outline">
                <div class="mars">
                    <div class="mars-label">Mars</div>
                </div>
            </div>

            <div class="jupitar-outline">
                <div class="jupitar">
                    <div class="jupitar-label">Jupitar</div>    
                </div>
            </div>

            <div class="saturn-outline">
                <div class="saturn">
                    <div class="saturn-label">Saturn</div>
                </div>
            </div>

            <div class="uranus-outline">
                <div class="uranus">
                    <div class="uranus-label">Uranus</div>
                </div>
            </div>

            <div class="neptune-outline">
                <div class="neptune">
                    <div class="neptune-label">Neptune</div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
